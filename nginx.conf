# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name primeiroolhar.app.br;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS principal
server {
    listen 443 ssl;
    server_name primeiroolhar.app.br;

    # Certificados SSL (gerados pelo Certbot no servidor)
    ssl_certificate     /etc/letsencrypt/live/primeiroolhar.app.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primeiroolhar.app.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 1. Roteamento do Backend (FastAPI)
    # DEVE vir antes do location / para ter prioridade
    location /api {
        proxy_pass http://10.100.27.221:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout generoso para processamento de vídeo pela IA
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        client_max_body_size 100M;
    }

    # 2. Roteamento do Frontend (Next.js)
    location / {
        proxy_pass http://10.100.27.221:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}