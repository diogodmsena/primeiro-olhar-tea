# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name primeiroolhar.app.br www.primeiroolhar.app.br;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS principal
server {
    listen 443 ssl;
    server_name primeiroolhar.app.br www.primeiroolhar.app.br;

    # Certificados SSL gerenciados pelo Certbot
    ssl_certificate     /etc/letsencrypt/live/primeiroolhar.app.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primeiroolhar.app.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Rota para o Backend (FastAPI) — deve vir ANTES do location /
    location /api/ {
        proxy_pass http://localhost:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout generoso para processamento de vídeo pela IA
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        client_max_body_size 100M;
    }

    # Rota para o Frontend (Next.js)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}