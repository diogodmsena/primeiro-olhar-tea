server {
    listen 80;
    server_name primeiroolhar.app.br;

    # 1. Roteamento do Backend (FastAPI)
    # DEVE vir antes do location / para ter prioridade no nginx
    # Sem trailing slash no proxy_pass: preserva URI completa
    # Ex: /api/triagem → http://10.100.27.221:8000/api/triagem ✓
    location /api {
        proxy_pass http://10.100.27.221:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout generoso para processamento de vídeo pela IA
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        client_max_body_size 100M;
    }

    # 2. Roteamento do Frontend (Next.js)
    location / {
        proxy_pass http://10.100.27.221:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets para Next.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}