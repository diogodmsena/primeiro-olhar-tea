server {
    listen 80;
    server_name primeiroolhar.app.br;

    # 1. Roteamento do Backend (FastAPI)
    # DEVE vir antes do location / para ter prioridade no nginx
    # O FastAPI já usa prefix="/api", então encaminhamos o caminho completo
    location /api {
        proxy_pass http://10.100.27.221:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos para upload de vídeo via mobile (redes LTE lentas)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 75s;
        client_max_body_size 100M;

        # Buffer otimizado para uploads grandes
        proxy_request_buffering off;
        client_body_timeout 300s;
    }

    # 2. Roteamento do Frontend (Next.js)
    # Porta 3000 conforme definido no docker-compose.prod.yml
    location / {
        proxy_pass http://10.100.27.221:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets para Next.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}