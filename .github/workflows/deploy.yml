name: Deploy to SaveinCloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Vincula o job ao ambiente criado no GitHub
    environment: production 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to SaveinCloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Passamos os segredos para o contexto do script SSH
          envs: GOOGLE_CLIENT_ID,JWT_SECRET,NEXT_PUBLIC_API_URL,GEMMA_API_KEY,GEMMA_MODEL
          script: |
            # Entra na pasta do projeto
            cd /root/projects/primeiro-olhar/
            
            # Puxa o código mais recente
            git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
            
            # CRIA O .ENV DIRETAMENTE NO SERVIDOR
            # Isso garante que o docker-compose leia as variáveis durante o build
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
            echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> .env
            echo "GEMMA_API_KEY=${{ secrets.GEMMA_API_KEY }}" >> .env
            echo "GEMMA_MODEL=${{ secrets.GEMMA_MODEL }}" >> .env
            echo "ANDROID_CLIENT_ID=${{ secrets.ANDROID_CLIENT_ID }}" >> .env
            
            # Também criamos o .env específico do backend se necessário
            # (conforme seu docker-compose.prod.yml que busca em ./backend/.env)
            cp .env ./backend/.env
            
            # Tenta baixar as imagens base antes para evitar timeout no build
            docker pull python:3.11-slim || true
            docker pull jc21/nginx-proxy-manager:latest || true

            # Reconstrói os containers
            # O Docker Compose usará o .env local para preencher os 'args' do frontend
            docker-compose -f docker-compose.prod.yml up -d --build
