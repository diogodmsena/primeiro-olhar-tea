services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "8000:8000" 
    volumes:
      - backend_data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - DB_PATH=/app/data/triagem.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api 
    depends_on:
      - backend

volumes:
  backend_data: