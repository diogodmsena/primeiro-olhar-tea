services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "8000:8000" 
    volumes:
      - backend_data:/app/data
      - triagem_videos:/tmp/triagem_videos
    env_file:
      - ./backend/.env
    environment:
      - DB_PATH=/app/data/triagem.db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A services.worker.celery_app worker --loglevel=info
    restart: always
    volumes:
      - backend_data:/app/data
      - triagem_videos:/tmp/triagem_videos
    env_file:
      - ./backend/.env
    environment:
      - DB_PATH=/app/data/triagem.db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - backend

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    depends_on:
      - backend

  nginx:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: always
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend
      - backend

volumes:
  backend_data:
  triagem_videos:
  npm_data:
  npm_letsencrypt: